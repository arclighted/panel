# Semgrep configuration for the Arclight panel.
#
# CI runs semgrep scoped to the application source (src/ and tests/) with a set
# of registry packs passed on the command line, since packs (p/...) cannot be
# referenced from inside a config file's rules: array. See the `semgrep` job in
# .github/workflows/ci.yml for the full invocation:
#
#   semgrep scan --config .semgrep.yml \
#     --config p/owasp-top-ten \
#     --config p/security-audit \
#     --config p/secrets \
#     --error --verbose src tests

rules:
  - id: no-eval
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: Avoid using eval() as it can lead to code injection.
    pattern: eval(...)

  - id: no-child-process-shell-true
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: Running child processes with shell:true can lead to command injection. Prefer shell:false with an arguments array.
    patterns:
      - pattern-either:
          - pattern: "$FN($ARGS, { ..., shell: true, ... })"
          - pattern: "$FN($ARGS, $OPTS, { ..., shell: true, ... })"
