name: release-pr

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  open-or-refresh:
    runs-on: ubuntu-latest
    # Never run on the merge of our own release PR (covered for all merge modes:
    # squash/rebase commits carry the chore(release) message, merge commits name
    # the release/next branch) or on bot pushes.
    if: >
      github.event.head_commit.message != null &&
      !contains(github.event.head_commit.message, 'chore(release): bump version to') &&
      !contains(github.event.head_commit.message, 'release/next') &&
      github.actor != 'github-actions[bot]'
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: compute next patch version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          echo "new=${MAJOR}.${MINOR}.$((PATCH + 1))" >> "$GITHUB_OUTPUT"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"

      - name: reset standing release branch onto latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B release/next origin/main

      - name: bump version files
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.version.outputs.new }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          sed -i "s/v[0-9]*\.[0-9]*\.[0-9]*[^ ]*/v${{ steps.version.outputs.new }}/g" README.md || true
          if [ -f docs/specsheet.md ]; then
            sed -i "s/v[0-9]*\.[0-9]*\.[0-9]*[^ ]*/v${{ steps.version.outputs.new }}/g" docs/specsheet.md || true
          fi

      - name: commit
        run: |
          git add package.json README.md docs/ 2>/dev/null || true
          git diff --cached --quiet && echo "no version change" && exit 0
          git commit -m "chore(release): bump version to v${{ steps.version.outputs.new }}"

      - name: push branch
        # Deterministic content: the bump depends only on main's version, so
        # concurrent runs produce identical trees and force-with-lease succeeds.
        # If the remote moved mid-run we fail loudly instead of clobbering a
        # fresher refresh; the next push to main re-runs this workflow anyway.
        run: |
          git push --force-with-lease origin release/next

      - name: open or refresh PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="chore(release): bump version to v${{ steps.version.outputs.new }}"
          BODY="Auto-generated by the release-pr workflow on every push to main.

          Merging this PR will:
          - bump package.json to v${{ steps.version.outputs.new }}
          - create the git tag v${{ steps.version.outputs.new }}
          - publish a GitHub release with auto-generated notes"
          if gh pr view release/next --json number --jq .number >/dev/null 2>&1; then
            gh pr edit release/next --title "$TITLE" --body "$BODY"
            echo "Refreshed existing release/next PR"
          else
            gh pr create --base main --head release/next --title "$TITLE" --body "$BODY"
            echo "Opened new release/next PR"
          fi
